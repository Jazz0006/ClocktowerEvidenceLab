name: C2 bounded podcast validation
# Bounded C2B -> C2C -> C2D acquisition batches; full media/transcripts stay outside artifacts.

on:
  push:
    branches:
      - docs/podcast-batch-ingestion-route-20260929
    paths:
      - .github/workflows/c2-bounded-podcast-validation.yml
      - pyproject.toml
  pull_request:
    branches:
      - main
    paths:
      - .github/c2-bounded-validation-token

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_name: things-we-missed
            guid: 8d701722-2da6-40b5-8d97-419711d78fda
          - case_name: trouble-brewing-revisited
            guid: 5066cfcc-369c-4b26-a01b-c19d36a2013e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install acquisition + ASR support
        run: python -m pip install -e ".[asr]"
      - name: Build live C2 manifest
        run: clocktower-podcast-manifest --output manifest.json
      - name: Acquire and transcribe bounded episode
        run: |
          clocktower-podcast-batch manifest.json \
            --work-dir work \
            --guid "${{ matrix.guid }}"
      - name: Extract lightweight candidates and bounded review packet
        env:
          CASE_NAME: ${{ matrix.case_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          work = pathlib.Path("work")
          result = json.loads((work / "batch-progress.json").read_text(encoding="utf-8"))
          progress = result["progress"]
          if len(progress) != 1:
              raise SystemExit(f"expected one completed item, got {len(progress)}")

          item = progress[0]
          asr_relative = item.get("asr_relative_path")
          if not asr_relative:
              raise SystemExit("bounded validation expected AUDIO_ASR progress")

          output_dir = pathlib.Path("lightweight")
          output_dir.mkdir(parents=True, exist_ok=True)
          candidate_path = output_dir / f"{os.environ['CASE_NAME']}-candidates.json"
          review_path = output_dir / f"{os.environ['CASE_NAME']}-review.json"
          subprocess.run(
              [
                  "clocktower-podcast-candidates",
                  str(work / asr_relative),
                  "--source-id",
                  item["source_id"],
                  "--output",
                  str(candidate_path),
              ],
              check=True,
          )
          subprocess.run(
              [
                  "clocktower-podcast-review",
                  str(candidate_path),
                  "--output",
                  str(review_path),
              ],
              check=True,
          )
          (output_dir / f"{os.environ['CASE_NAME']}-progress.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          updated = json.loads((work / "manifest.updated.json").read_text(encoding="utf-8"))
          (output_dir / f"{os.environ['CASE_NAME']}-manifest.json").write_text(
              json.dumps(updated, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload lightweight validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c2-bounded-${{ matrix.case_name }}
          path: lightweight/
          if-no-files-found: error
