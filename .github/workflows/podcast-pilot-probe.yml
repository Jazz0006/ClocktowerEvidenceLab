name: podcast-pilot-probe

on:
  push:
    branches:
      - podcast-expert-rationale-pilot-20260928
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Probe episode 16
        run: |
          clocktower-podcast-probe \
            "https://anchor.fm/s/daf1f9c/podcast/rss" \
            --title-contains "16: Drunk" \
            > episode16.json
          cat episode16.json
      - uses: actions/upload-artifact@v4
        with:
          name: podcast-episode-16-probe
          path: episode16.json
          if-no-files-found: error
