name: podcast-recluse-asr-scout

on:
  pull_request:
    branches: [main]

jobs:
  scout:
    if: github.event.pull_request.head.ref == 'podcast-expert-rationale-pilot-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project with ASR support
        run: python -m pip install -e ".[asr]"

      - name: Locate and transcribe Recluse episode
        shell: bash
        run: |
          set -euo pipefail
          clocktower-podcast-probe \
            "https://anchor.fm/s/daf1f9c/podcast/rss" \
            --title-contains "Recluse (Trouble Brewing)" \
            > recluse.probe.json

          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          episodes = json.loads(Path("recluse.probe.json").read_text())
          if len(episodes) != 1:
              raise SystemExit(f"expected one episode, got {len(episodes)}")
          audio_url = episodes[0]["audio_url"]
          request = Request(audio_url, headers={"User-Agent": "ClocktowerEvidenceLab/0.1 podcast-asr-scout"})
          with urlopen(request, timeout=60) as response:
              Path("recluse.mp3").write_bytes(response.read())
          PY

          clocktower-podcast-asr recluse.mp3 \
            --output recluse.asr.json \
            --model small.en \
            --device cpu \
            --compute-type int8 \
            --language en \
            --beam-size 1

      - name: Upload acquisition artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recluse-asr-scout
          path: |
            recluse.probe.json
            recluse.asr.json
          retention-days: 1
