name: CT-1 one-shot R04 probe

on:
  push:
    branches:
      - el-ml1b-8-r02-prefix-audit
    paths:
      - .github/workflows/ct1-one-shot-r02.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install acquisition tooling
        run: python -m pip install -e .
      - name: Fetch and normalize explicit R04 payload
        env:
          GAME_ID: ffb40a93-3d7b-42c4-bba8-bc9c363dcd30
        run: |
          clocktower-clocktracker-probe "$GAME_ID" > /tmp/clocktracker-r04.json
          python - <<'PY'
          import json

          data = json.load(open("/tmp/clocktracker-r04.json", encoding="utf-8"))
          summary = {
              "game_id": data["game_id"],
              "player_count": data["player_count"],
              "storyteller": data["storyteller"],
              "demon_bluffs": data["demon_bluffs"],
              "grimoire_count": len(data["grimoires"]),
              "grimoires": [
                  {
                      "grimoire_id": grim["grimoire_id"],
                      "orders_unique": grim["orders_unique"],
                      "seat_count": len(grim["seats"]),
                      "orders": [seat["order"] for seat in grim["seats"]],
                      "roles": [
                          {
                              "order": seat["order"],
                              "source_index": seat["source_index"],
                              "player_name": seat["player_name"],
                              "role_id": seat["role_id"],
                              "related_role_id": seat["related_role_id"],
                          }
                          for seat in grim["seats"]
                      ],
                  }
                  for grim in data["grimoires"]
              ],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
