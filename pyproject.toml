[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clocktower-evidence-lab"
version = "0.1.0"
description = "Local-first evidence reconstruction for real Blood on the Clocktower games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1,<2",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
]

[project.scripts]
clocktower-podcast-probe = "clocktower_evidence_lab.acquisition.podcast_probe:main"
clocktower-podcast-asr = "clocktower_evidence_lab.acquisition.podcast_asr:main"
clocktower-podcast-manifest = "clocktower_evidence_lab.acquisition.podcast_manifest_cli:main"
clocktower-podcast-batch = "clocktower_evidence_lab.acquisition.podcast_batch_cli:main"

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.1,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["clocktower_evidence_lab"]
