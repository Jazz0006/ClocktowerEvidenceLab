[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clocktower-evidence-lab"
version = "0.1.0"
description = "Local-first evidence reconstruction for real Blood on the Clocktower games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1,<2",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
